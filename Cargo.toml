[package]
name = "opencalc"
version = "1.1.10"
edition = "2021"
build = "build.rs"
authors = ["Reverse-engineered clean-room reimplementation"]
description = "OpenCalc: a Windows 95 Calculator reimplementation with wxDragon and a corrected expression parser"
license = "MIT"

[[bin]]
name = "OpenCalc"
path = "src/main.rs"

[dependencies]
wxdragon = "=0.9.17"
plotters = "=0.3.7"
plotters-wxdragon = "=0.1.1"

[build-dependencies]
winresource = "=0.1.31"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
